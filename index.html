<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 디지털 기반 교실의 변화, 교사는 무엇을 설계하는가</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#e9ecf2; --win:#ffffff; --bar:#f4f5f8; --line:#e3e5ea;
  --ink:#1d1d1f; --sub:#5f6370; --mute:#8b8f9a;
  --blue:#0a66d8; --blue-soft:#e8f1fd;
  --green:#1f9d55; --green-soft:#e6f6ec;
  --orange:#d9730d; --orange-soft:#fdf0e3;
  --red:#d93a3a; --red-soft:#fdeaea;
  --purple:#7a4fd6; --purple-soft:#f1ebfd;
  --note:#fff6c9;
  --radius:14px;
  --shadow:0 20px 60px rgba(20,30,60,.18),0 2px 8px rgba(20,30,60,.08);
}
body.dark{
  --bg:#16181d; --win:#1f2128; --bar:#272a32; --line:#343843;
  --ink:#f2f3f5; --sub:#b4b8c2; --mute:#8a8f9b;
  --blue:#4c9bff; --blue-soft:#1d2c44;
  --green:#3ccf7d; --green-soft:#183326;
  --orange:#f2a04b; --orange-soft:#3a2a19;
  --red:#ff6b6b; --red-soft:#3e1f22;
  --purple:#a98bff; --purple-soft:#2b2343;
  --note:#4a4222;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:var(--blue)}
button{font-family:inherit}

/* ---------- window ---------- */
.window{position:fixed;inset:18px;background:var(--win);border-radius:var(--radius);box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.titlebar{height:44px;flex:0 0 44px;display:flex;align-items:center;gap:12px;padding:0 14px;
  background:var(--bar);border-bottom:1px solid var(--line);user-select:none}
.lights{display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.wtitle{flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px}
.tbtn{border:1px solid var(--line);background:var(--win);color:var(--ink);font-size:12px;font-weight:600;
  padding:5px 10px;border-radius:7px;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:var(--blue-soft);color:var(--blue)}

.stage{flex:1;overflow:hidden;position:relative}
.slides{height:100%}
.slide{display:none;height:100%;overflow:auto;padding:clamp(28px,4.2vw,64px) clamp(28px,6vw,96px)}
.slide.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.inner{max-width:1180px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center}

.statusbar{height:46px;flex:0 0 46px;display:flex;align-items:center;gap:14px;padding:0 16px;
  border-top:1px solid var(--line);background:var(--bar);font-size:12.5px;color:var(--sub);user-select:none}
.nav{display:flex;gap:6px}
.nav button{width:30px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--win);color:var(--ink);cursor:pointer;font-size:14px}
.nav button:hover{background:var(--blue-soft)}
.progress{flex:1;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress b{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
.secname{min-width:120px;font-weight:600}
.timer{cursor:pointer;font-variant-numeric:tabular-nums;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--win)}
.timer.run{color:var(--blue);border-color:var(--blue)}
.timer.over{color:var(--red);border-color:var(--red)}

/* ---------- typography ---------- */
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:clamp(12px,1.05vw,15px);font-weight:700;letter-spacing:.02em;
  color:var(--blue);margin-bottom:14px}
.kicker .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
h1{font-size:clamp(30px,3.6vw,56px);line-height:1.2;margin:0 0 18px;letter-spacing:-.02em}
h2{font-size:clamp(24px,2.6vw,40px);line-height:1.25;margin:0 0 22px;letter-spacing:-.015em}
h3{font-size:clamp(16px,1.35vw,21px);margin:0 0 8px;line-height:1.35}
p,li{font-size:clamp(14.5px,1.2vw,18.5px);line-height:1.65;color:var(--sub);margin:0}
.lead{font-size:clamp(16px,1.45vw,22px);color:var(--sub);line-height:1.6;margin-bottom:26px}
strong,b{color:var(--ink)}
.hl{background:linear-gradient(transparent 60%,rgba(10,102,216,.18) 0);color:var(--ink);font-weight:700}
.small{font-size:clamp(12px,.95vw,14px);color:var(--mute)}

/* ---------- components ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{border:1px solid var(--line);border-radius:12px;padding:20px 22px;background:var(--win)}
.card.soft{background:var(--bar);border-color:transparent}
.card .ic{font-size:26px;margin-bottom:8px;display:block}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;margin-bottom:10px}
.t-blue{background:var(--blue-soft);color:var(--blue)}.t-green{background:var(--green-soft);color:var(--green)}
.t-orange{background:var(--orange-soft);color:var(--orange)}.t-red{background:var(--red-soft);color:var(--red)}
.t-purple{background:var(--purple-soft);color:var(--purple)}
.bl-blue{border-left:4px solid var(--blue)}.bl-green{border-left:4px solid var(--green)}
.bl-orange{border-left:4px solid var(--orange)}.bl-red{border-left:4px solid var(--red)}.bl-purple{border-left:4px solid var(--purple)}
.callout{margin-top:22px;padding:16px 20px;border-radius:12px;background:var(--blue-soft);color:var(--ink);
  font-size:clamp(15px,1.3vw,20px);font-weight:600;line-height:1.55}
.callout.red{background:var(--red-soft)}.callout.green{background:var(--green-soft)}
.list{padding-left:1.1em;margin:0}.list li{margin:5px 0}
.big-num{font-size:clamp(30px,3.2vw,48px);font-weight:800;color:var(--ink);line-height:1.1;letter-spacing:-.02em}
.arrow{color:var(--mute);font-weight:700}
.src{margin-top:18px;display:flex;flex-wrap:wrap;gap:6px 12px}
.src a{font-size:12.5px;color:var(--mute);text-decoration:none;border-bottom:1px dotted var(--mute)}
.src a:hover{color:var(--blue);border-color:var(--blue)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:10px;background:var(--blue);color:#fff;
  font-weight:700;text-decoration:none;font-size:15px;border:0;cursor:pointer}
.btn.ghost{background:var(--win);color:var(--blue);border:1px solid var(--blue)}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;margin-bottom:16px}
.tl-item:before{content:"";position:absolute;left:-23px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--win);border:3px solid var(--blue)}
.tl-item.warn:before{border-color:var(--orange)}
.tl-date{font-size:13px;font-weight:700;color:var(--blue)}
.tl-item.warn .tl-date{color:var(--orange)}

/* flow */
.flow{display:flex;align-items:stretch;gap:10px}
.flow .card{flex:1}
.flow .arrow{display:flex;align-items:center;font-size:22px}

/* cover */
.cover h1{font-size:clamp(34px,4.3vw,66px)}
.cover-meta{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-top:40px;flex-wrap:wrap}
.who b{font-size:clamp(17px,1.5vw,22px)}
.qr{text-align:center}
.qr img{width:150px;height:150px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:6px}
.qr div{font-size:12px;color:var(--mute);margin-top:6px}

/* boards */
.board-form{display:flex;gap:8px;margin:6px 0 16px;flex-wrap:wrap}
.board-form input,.board-form textarea{font-family:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;background:var(--win);color:var(--ink)}
.board-form input{width:130px}
.board-form textarea{flex:1;min-width:220px;height:46px;resize:none}
.board-form button{padding:0 18px;border-radius:10px;border:0;background:var(--blue);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.board-form button:disabled{opacity:.5}
.board-meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mute);margin-bottom:10px}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;max-height:46vh;overflow:auto;padding:2px}
.note{background:var(--note);border-radius:10px;padding:13px 14px;font-size:15px;line-height:1.5;color:var(--ink);
  box-shadow:0 2px 6px rgba(0,0,0,.06);animation:pop .3s ease;white-space:pre-wrap;word-break:break-word}
.note small{display:block;margin-top:8px;color:var(--sub);font-size:12px}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.empty{color:var(--mute);font-size:14px;padding:20px;border:1px dashed var(--line);border-radius:10px;text-align:center;grid-column:1/-1}

/* poll */
.poll-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.popt{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--win);
  padding:14px 16px;cursor:pointer;color:var(--ink);font-size:clamp(14.5px,1.15vw,17.5px);font-weight:600;display:flex;justify-content:space-between;gap:10px}
.popt .bar{position:absolute;left:0;top:0;bottom:0;background:var(--blue-soft);width:0;transition:width .5s;z-index:0}
.popt span{position:relative;z-index:1}
.popt .cnt{color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap}
.popt.mine{border-color:var(--blue)}
.popt:disabled{cursor:default}
.poll-note{margin-top:12px;font-size:13px;color:var(--mute)}

/* profile */
.profile{display:grid;grid-template-columns:minmax(180px,280px) 1fr;gap:clamp(24px,3.5vw,52px);align-items:stretch}
.pf-photo{width:100%;height:100%;min-height:0;object-fit:cover;object-position:center 30%;border-radius:14px;display:block;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.awards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.award{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--orange-soft)}
.award>span{font-size:24px}
.award b{font-size:clamp(14px,1.1vw,16.5px);display:block}
.award p{font-size:13px}
.cv{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.cv li{display:flex;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:clamp(14px,1.08vw,16.5px);color:var(--ink);line-height:1.45}
.cv li span{flex:0 0 140px;color:var(--blue);font-weight:700;font-variant-numeric:tabular-nums}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.chip{font-size:clamp(13px,1vw,15px);padding:7px 12px;border-radius:999px;background:var(--bar);color:var(--sub);font-weight:600}
.c-blue{background:var(--blue-soft);color:var(--blue)}.c-green{background:var(--green-soft);color:var(--green)}
.c-purple{background:var(--purple-soft);color:var(--purple)}.c-red{background:var(--red-soft);color:var(--red)}

/* video */
.video{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.vcol{display:flex;flex-direction:column}
.vcol .video{flex:1;padding-top:0;min-height:220px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* poll extras */
.etc-form{display:flex;gap:8px;margin-top:12px}
.etc-form[hidden]{display:none}
.etc-form input{flex:1;font-family:inherit;font-size:15px;border:1px solid var(--blue);border-radius:10px;padding:11px 13px;background:var(--win);color:var(--ink)}
.etc-form button{padding:0 18px;border-radius:10px;border:0;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}
.etc-title{font-size:13px;color:var(--mute);margin:14px 0 8px}
.etc-notes .notes{max-height:22vh}
.poll-admin{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
body.doc .presenter-only{display:none}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal[hidden]{display:none}
.modal-win{background:var(--win);border-radius:var(--radius);box-shadow:var(--shadow);width:min(860px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.modal-body{padding:26px 30px;overflow:auto}
.hist{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px}
.hist summary{cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hbars{margin-top:12px;display:grid;gap:6px}
.hrow{display:grid;grid-template-columns:minmax(160px,1.2fr) 2fr auto;gap:10px;align-items:center;font-size:14px}
.hbar{height:10px;background:var(--bar);border-radius:6px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--blue);border-radius:6px}
.hrow b{font-size:13px;min-width:70px;text-align:right}

/* equal-height layouts */
.eq{align-items:stretch}
.eq>*{min-width:0}
.rcol{display:flex;flex-direction:column}
.rcol .callout{margin-top:16px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stats3 .card{display:flex;flex-direction:column;justify-content:center}
.stats3 .big-num{font-size:clamp(22px,2.3vw,34px)}
.callout.fill{margin-top:0;display:flex;align-items:center}
.steps{display:grid;grid-template-rows:repeat(4,1fr);gap:8px}
.step{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 16px;background:var(--win)}
.step .tag{margin:0;flex:0 0 auto;min-width:58px;text-align:center}
.step h3{margin-bottom:2px}
.step p{font-size:clamp(13.5px,1.05vw,16px);line-height:1.5}
.shot-col{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.shot-col .btn{align-self:stretch;justify-content:center}
.shot{margin:0;flex:1;display:flex;flex-direction:column;min-height:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.10);background:var(--bar)}
.shot img{display:block;width:100%;flex:1;min-height:180px;height:0;object-fit:cover;object-position:left top}
.shot .shot-ph{flex:1;aspect-ratio:auto;min-height:180px}
.shot figcaption{font-size:12.5px;color:var(--mute);padding:8px 12px}
.shot-ph{aspect-ratio:1280/760;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed var(--line);color:var(--mute);font-weight:700;gap:4px}
.shortcuts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.shortcuts a.chip{text-decoration:none}
.shortcuts a.chip:hover{filter:brightness(.95)}

/* refs */
.refs{columns:2;column-gap:32px}
.refs .grp{break-inside:avoid;margin-bottom:16px}
.refs h3{font-size:15px;color:var(--blue)}
.refs li{font-size:13.5px;line-height:1.55;margin:4px 0}
.refs a{text-decoration:none}
.refs a:hover{text-decoration:underline}

.mode-pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--orange-soft);color:var(--orange);font-weight:700;margin-left:6px}

/* ---------- doc mode ---------- */
body.doc{overflow:auto}
body.doc .window{position:static;inset:auto;margin:18px auto;max-width:1100px;overflow:visible}
body.doc .stage{overflow:visible}
body.doc .slide{display:block!important;height:auto;overflow:visible;padding:44px 48px;border-bottom:1px solid var(--line);animation:none}
body.doc .inner{min-height:0}
body.doc .statusbar{display:none}
body.doc .notes{max-height:none}
body.doc .titlebar{position:sticky;top:0;z-index:5}

@media (max-width:760px){
  body:not(.present-forced){}
  .window{inset:0;border-radius:0}
  body.doc .window{margin:0;border-radius:0;border:0}
  body.doc .slide{padding:30px 20px}
  .g2,.g3,.g4,.poll-opts{grid-template-columns:1fr}
  .flow{flex-direction:column}.flow .arrow{justify-content:center;transform:rotate(90deg)}
  .refs{columns:1}
  .lights,.wtitle{display:none}
  .titlebar{justify-content:flex-end}
  .qr{display:none}
  .board-form input{width:100%}
  .board-form textarea{height:70px}
  .profile,.awards,.stats3{grid-template-columns:1fr}
  .steps{grid-template-rows:none}
  .pf-photo{max-width:220px;height:auto}
  .vcol .video{padding-top:56.25%;flex:none}
  .shot img{height:auto;flex:none;aspect-ratio:1280/760}
  .shot .shot-ph{aspect-ratio:1280/760;flex:none}
  .cv li span{flex-basis:96px}
  .hrow{grid-template-columns:1fr;gap:4px}
  #btnFull{display:none}
}

/* ---------- print ---------- */
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  body *{animation:none!important}
  .window{position:static!important;box-shadow:none;border:0;border-radius:0;display:block}
  .titlebar,.statusbar,.board-form,.qr,.tbtn,.poll-admin,.modal,.etc-form,.video{display:none!important}
  .stage{overflow:visible}
  .slide{display:block!important;height:auto;overflow:visible;padding:0 0 18px;margin:0 0 18px;border-bottom:1px solid #ddd;page-break-inside:avoid;break-inside:avoid}
  .slide.long{page-break-inside:auto;break-inside:auto}
  .inner{min-height:0;max-width:none}
  .notes{max-height:none;overflow:visible}
  h1{font-size:28px}h2{font-size:22px}p,li{font-size:12.5px}
  .card{padding:12px 14px}
  .src a{color:#555}
}
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="wtitle" id="wtitle">AI 디지털 기반 교실의 변화, 교사는 무엇을 설계하는가</div>
    <div class="tools">
      <button class="tbtn" id="btnMode" title="발표/자료 전환 (D)">자료 모드</button>
      <button class="tbtn" id="btnPdf" title="PDF로 저장">PDF 다운로드</button>
      <button class="tbtn" id="btnDark" title="다크 모드">다크</button>
      <button class="tbtn" id="btnFull" title="전체 화면 (F)">전체 화면</button>
    </div>
  </div>
  <div class="stage"><div class="slides" id="slides"></div></div>
  <div class="statusbar">
    <div class="nav"><button id="prev" aria-label="이전">‹</button><button id="next" aria-label="다음">›</button></div>
    <span id="pageno">1 / 1</span>
    <span class="secname" id="secname"></span>
    <div class="progress"><b id="bar"></b></div>
    <span class="timer" id="timer" title="클릭: 시작/정지, 더블클릭: 초기화">⏱ 00:00 / 50:00</span>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-win">
    <div class="titlebar"><div class="lights"><i id="modalClose" style="cursor:pointer" title="닫기"></i><i></i><i></i></div><div class="wtitle">이전 강의 결과</div><div style="width:52px"></div></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
/* =========================================================
   설정 — 배포 전에 여기만 바꾸면 됩니다
   ========================================================= */
const CONFIG = {
  SCRIPT_URL: '',https://script.google.com/macros/s/AKfycby102aZMb9Q1GcO0sFfn7rkQoqEhokohNRn7wkHbQvfAyawTcok_YKwo2rZoziRTAgCtg/exec// 구글 Apps Script 웹 앱 URL (…/exec). 비우면 체험 모드
  POLL_MS: 5000,             // 실시간 보드 새로고침 간격
  TALK_MINUTES: 50,          // 강의 타이머 기준 시간
  LINKS: {

/* 3 수학 */
{sec:'인트로', html:`
  <div class="kicker"><span class="dot"></span>인트로 ① 수학</div>
  <h2>AI가 수학 난제를 해결하고 있다</h2>
  <div class="grid g2 eq">
    <div class="card bl-blue">
      <span class="tag t-blue">2026. 11. 20.</span>
      <h3>"Claude로 리만 가설을 증명했다"</h3>
      <ul class="list">
        <li>앤트로픽 소속 수학자 레벤트 알푀게가 약 6주 동안 Claude로 증명을 완성했다고 발표</li>
        <li>리만 가설: 소수의 분포에 관한 약 170년 된 수학계 최고의 난제</li>
        <li>증명은 정확성을 컴퓨터로 검증하는 언어 <b>Lean</b>으로 작성</li>
        <li>옳다고 확인되면 수학 역사상 가장 중요한 성과 중 하나</li>
      </ul>
    </div>
    <div class="card soft">
      <span class="tag t-orange">수학자들의 반응</span>
      <h3>"검증에는 시간이 걸린다"</h3>
      <ul class="list">
        <li><b>테렌스 타오</b>: 증명을 이해하고 검토하는 데 시간이 걸릴 것. 다만 이번에는 검증을 도울 인간 저자와 직접 소통할 수 있다</li>
        <li><b>일부 수학자들의 공동 서한</b>: AI 기업들이 상용 제품을 홍보하려고 난제 해결을 내세우는 것은 학문에 해롭다</li>
        <li>전문가 검증에는 수개월, 길게는 그 이상이 걸릴 전망</li>
      </ul>
    </div>
    <div class="stats3">
      <div class="card soft"><div class="big-num">170년</div><p class="small">풀리지 않은 시간</p></div>
      <div class="card soft"><div class="big-num">6주</div><p class="small">AI와 함께한 시간</p></div>
      <div class="card soft"><div class="big-num">25만 쪽+</div><p class="small">Lean 증명 분량</p></div>
    </div>
    <div class="callout fill"><div><b>증명 주장 ≠ 검증된 지식</b><br>AI는 답을 빠르게 만들지만, 그 답을 믿을 수 있게 만드는 일은 여전히 사람의 몫입니다.</div></div>
  </div>
  ${src('bbcRH')}`},

/* 4 노벨상 */
{sec:'인트로', html:`
  <div class="kicker"><span class="dot"></span>인트로 ② 과학</div>
  <h2>AI를 만들고 활용하여 노벨상을 받다</h2>
  <div class="grid g2">
    <div class="card bl-green"><span class="tag t-green">2024 노벨 물리학상 · AI를 만들다</span><h3>존 홉필드 · 제프리 힌턴</h3>
      <ul class="list">
        <li><b>홉필드</b>: 물리학의 에너지 개념을 빌려, 흐릿한 패턴을 넣어도 저장된 기억을 되살려 내는 신경망(홉필드 네트워크)을 고안</li>
        <li><b>힌턴</b>: 통계물리를 바탕으로 데이터 속 특징을 스스로 찾아 배우는 볼츠만 머신을 개발해 오늘날 딥러닝의 토대를 놓음</li>
      </ul></div>
    <div class="card bl-green"><span class="tag t-green">2024 노벨 화학상 · AI를 활용하다</span><h3>데미스 허사비스 · 존 점퍼 (+ 데이비드 베이커)</h3>
      <ul class="list">
        <li><b>허사비스·점퍼</b>: AI 모델 AlphaFold로 아미노산 서열만 보고 단백질의 3차원 구조를 예측. 50년 난제를 풀고 2억 개가 넘는 단백질 구조를 예측</li>
        <li><b>베이커</b>: 컴퓨터로 자연에 없던 새로운 단백질을 설계</li>
      </ul></div>
  </div>
  <div class="card soft" style="margin-top:16px">
    <p><b>노벨재단 (2026. 9. 노벨프라이즈 다이얼로그 서울)</b> — AI가 이미 수상 업적에 중요한 역할을 하고 있지만, "인류에게 혜택을 가져다준 업적"이라는 원칙은 그대로 지킨다.</p>
  </div>
  <div class="callout green">AI는 도구이고, 무엇을 묻고 어디에 쓸지 설계한 사람의 판단이 업적이 됩니다.</div>

{sec:'인트로', html:`
  <div class="kicker"><span class="dot"></span>인트로 ③ 창작</div>
  <h2>머무르, 「꿈꾸던 어른이 되었나요?」</h2>
  <div class="grid g2 eq">
    <div class="vcol">
      <div class="video"><iframe src="https://www.youtube-nocookie.com/embed/GxChUrrY4bc?rel=0" title="머무르 - 꿈꾸던 어른이 되었나요?" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
      <p class="small" style="margin-top:6px">영상이 재생되지 않으면 <a href="https://www.youtube.com/watch?v=GxChUrrY4bc" target="_blank" rel="noopener">유튜브에서 보기 ↗</a></p>
    </div>
    <div>
      <div class="grid g2" style="gap:10px">
        <div class="card"><div class="big-num">1위</div><p>2026. 11. 13. 멜론 TOP100<br>AI로 작곡·가창한 곡으로는 처음</p></div>
        <div class="card"><div class="big-num" style="color:var(--red)">0원</div><p>차트 1위에도<br>작사·작곡 저작권료는 0원</p></div>
      </div>
      <div class="card soft" style="margin-top:12px">
        <h3>왜 0원일까?</h3>
        <ul class="list">
          <li>사람이 기획·작사, 멜로디·편곡·보컬은 AI(Suno)로 생성</li>
          <li>저작권법은 <b>인간의 사상과 감정을 표현한 창작물</b>만 저작물로 인정 → 음저협 신탁 등록이 안 돼 작사·작곡 저작권료 0원</li>
          <li>음저협의 AI 활용곡 등록 기준은 22일 만에 철회, 인간 기여 인정 기준은 아직 없음</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="callout" style="margin-top:14px">창작의 문턱은 낮아졌습니다. 이제 질문은 "만들 수 있는가"가 아니라 "누구의 창작이고, 무엇을 표현하는가"입니다.</div>
  ${src('melon','fnMusic','melonCopy')}`},

/* 6 그늘 */
{sec:'인트로', cls:'long', html:`
  <div class="kicker" style="color:var(--red)"><span class="dot"></span>인트로 ④ 그늘</div>
  <h2>AI로 따낸 세무사 시험 수석 합격</h2>
  <div class="grid g2">
    <div class="card bl-red">
      <span class="tag t-red">제63회 세무사 시험</span>
      <h3>160문항 중 1문항만 틀린 수석 합격자의 자수</h3>
      <ul class="list">
        <li>초소형 카메라로 문제를 촬영 → 스마트폰 AI로 풀이 → 개조한 계산기로 정답 송수신</li>
        <li>감독관이 지켜보는 시험장에서도, 사후 점검에서도 적발되지 않음</li>
        <li>공인회계사 1차 시험에서도 같은 방식이었다고 진술</li>
      </ul>
    </div>
    <div class="card">
      <h3>사회가 치른 비용</h3>
      <ul class="list">
        <li>정부: 올해 국가자격시험 528개 종목 전수조사, 전파탐지기·AI 인스펙터 확대</li>
        <li>세무사회: 수습 세무사 전원을 <b>AI 도움 없는 환경에서</b> 다시 평가</li>
        <li>수능: 스마트기기 부정행위 적발, 응시 제한 최대 10년 추진, 교육부 장관 사임 논란까지</li>
      </ul>
    </div>
  </div>
  <div class="callout red">도구를 쓸 줄 아는 능력과, 정직하게 쓸 줄 아는 태도는 전혀 다른 문제입니다.</div>
  ${src('tax','newneek','taxAssoc','csat','csat10','bbcRH')}`},

/* 7 전환 질문 */
{sec:'인트로', html:`
  <div class="kicker"><span class="dot"></span>오늘의 질문</div>
  <h1>AI가 인간보다 똑똑한 시대,<br>교육은 어디로 가야 하는가?</h1>
  <div class="grid g3" style="margin-top:10px">
    <div class="card bl-blue"><span class="tag t-blue">교사 · 1부·2부</span><h3>무엇을 설계하는가</h3>
      <ul class="list">
        <li>지식을 전달하는 수업에서 <b>생각이 드러나는 수업</b>으로</li>
        <li>결과물이 아니라 <b>과정을 증거로 삼는 평가</b></li>
        <li>AI를 쓸 곳과 쓰지 않을 곳을 정하는 설계</li>
      </ul></div>
    <div class="card bl-green"><span class="tag t-green">학생 · 2부·3부</span><h3>무엇을 배워야 하는가</h3>
      <ul class="list">
        <li>AI에게 물을 <b>좋은 질문</b>을 만드는 힘</li>
        <li>AI의 답을 <b>의심하고 검증</b>하는 힘</li>
        <li>도구를 <b>정직하게</b> 쓰는 태도</li>
      </ul></div>
    <div class="card bl-purple"><span class="tag t-purple">함께 · 3부</span><h3>어떻게 성장하는가</h3>
      <ul class="list">
        <li>교사도 <b>계속 배우는 사람</b>으로</li>
        <li>수업의 질문을 <b>연구</b>로, 연구의 답을 다시 교실로</li>
        <li>혼자가 아니라 <b>나누는 공동체</b>로</li>
      </ul></div>
  </div>
  <div class="callout">AI보다 많이 아는 사람이 아니라, <b>AI와 함께 더 잘 생각하는 사람</b>을 길러야 합니다.</div>`},

/* 8 투표 */
{sec:'인트로', html:`
  <div class="kicker"><span class="dot"></span>실시간 투표</div>
  <h2>AI 시대, 학생이 꼭 배워야 할 한 가지는?</h2>
  <p class="lead">하나만 골라 주세요. 해당하는 것이 없으면 '기타'에 직접 써 주세요.</p>
  <div class="poll" data-board="poll"></div>
  <div class="poll-admin">
    <button class="tbtn" id="btnHistory">📊 이전 강의 결과 보기</button>
    <button class="tbtn presenter-only" id="btnReset">↺ 새 강의 시작 (리셋)</button>
  </div>`},

/* 9 1부 교실 */
{sec:'1부 · 바뀐 교실', html:`
  <div class="kicker"><span class="dot"></span>1부 · 바뀐 교실, 바뀐 교사</div>
  <h2>디지털 기기와 AI가 들어온 교실</h2>
  <div class="grid g3">
    <div class="card"><span class="ic">💻</span><h3>1인 1기기</h3><p>서울 디벗 보급 이후, 기기는 특별한 날의 도구가 아니라 매 수업의 필기구가 되었다</p></div>
    <div class="card"><span class="ic">✨</span><h3>검색에서 생성으로</h3><p>학생은 답을 찾지 않고 답을 '받는다'. 결과물은 쉬워졌고, 과정은 보이지 않게 되었다</p></div>
    <div class="card"><span class="ic">⚡</span><h3>즉시성</h3><p>피드백·번역·요약이 몇 초 만에. 기다리고 고민하는 시간이 학습에서 사라지기 쉽다</p></div>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card soft"><h3>교실에서 보이는 모습</h3><ul class="list"><li>완성도 높은 결과물, 설명하지 못하는 학생</li><li>AI 답을 그대로 믿는 학생과 끝까지 의심하는 학생의 격차</li></ul></div>
    <div class="card soft"><h3>그래서 생기는 질문</h3><ul class="list"><li>이 글은 누가 썼는가? 무엇을 배웠는가?</li><li>평가는 무엇을 근거로 해야 하는가?</li></ul></div>
  </div>`},

/* 10 교사 역할 */
{sec:'1부 · 바뀐 교실', html:`
  <div class="kicker"><span class="dot"></span>1부 · 교사의 역할</div>
  <h2>전달하는 교사에서 <span class="hl">설계하는 교사</span>로</h2>
  <div class="grid" style="gap:12px">
    <div class="flow"><div class="card soft"><p class="small">이전</p><h3>무엇을 가르칠까</h3></div><div class="arrow">→</div><div class="card bl-blue"><p class="small">지금</p><h3>무엇을 경험하고 생각하게 할까</h3></div></div>
    <div class="flow"><div class="card soft"><p class="small">이전</p><h3>정답을 확인한다</h3></div><div class="arrow">→</div><div class="card bl-blue"><p class="small">지금</p><h3>사고 과정이 드러나게 하고, 그 과정을 본다</h3></div></div>
    <div class="flow"><div class="card soft"><p class="small">이전</p><h3>주어진 도구를 쓴다</h3></div><div class="arrow">→</div><div class="card bl-blue"><p class="small">지금</p><h3>수업 목표에 맞는 도구를 고르고, 필요하면 만든다</h3></div></div>
  </div>
  <div class="callout">AI가 답을 줄 수 있는 시대에 교사의 일은 <b>배움이 일어나는 조건을 설계하는 것</b>입니다.</div>`},

/* 11 사례1 질문중심 */
{sec:'2부 · 수업 사례', html:`
  <div class="kicker"><span class="dot"></span>2부 · 사례 ① 질문중심 수업평가</div>
  <h2>답은 AI가 줄 수 있어도, 질문은 학생이 만든다</h2>
  <div class="grid g2 eq">
    <div class="steps">
      <div class="step"><span class="tag t-blue">읽기 전</span><div><h3>궁금증 만들기</h3><p>제목·그림·핵심어를 보고 스스로 질문을 만든다</p></div></div>
      <div class="step"><span class="tag t-green">읽기</span><div><h3>질문을 품고 읽기</h3><p>내 질문의 답을 찾으며 읽고, 질문을 고친다</p></div></div>
      <div class="step"><span class="tag t-purple">읽은 후</span><div><h3>묻고 답하기</h3><p>새로 생긴 질문을 패들렛에 올리고 친구와 주고받는다</p></div></div>
      <div class="step"><span class="tag t-orange">평가</span><div><h3>질문의 변화를 본다</h3><p>읽기 전후 질문이 어떻게 깊어졌는지가 평가의 근거</p></div></div>
    </div>
    <div class="shot-col">
      <figure class="shot">
        <img src="${CONFIG.IMAGES.PADLET}" alt="패들렛 샌드박스 Living with Big Data 수업 화면" onerror="this.outerHTML='<div class=&quot;shot-ph&quot;>패들렛 화면 캡처 자리<br><small>assets/padlet-bigdata.jpg</small></div>'">
        <figcaption>중3 영어 「Living with Big Data」 · "빅데이터란 무엇일까요?" 학생 질문·생각 나누기</figcaption>
      </figure>
      <a class="btn" href="${CONFIG.LINKS.PADLET_MAIN}" target="_blank" rel="noopener">Living with Big Data 패들렛 열기 ↗</a>
    </div>
  </div>
  <div class="shortcuts"><span class="small">다른 단원 바로가기</span>
    ${CONFIG.LINKS.PADLET_MORE.map(([t,u])=>`<a class="chip c-blue" href="${u}" target="_blank" rel="noopener">${t} ↗</a>`).join('')}
  </div>`},

/* 12 사례2 Writing Studio */
{sec:'2부 · 수업 사례', html:`

/* 14 사례 정리 */
{sec:'2부 · 수업 사례', html:`
  <div class="kicker"><span class="dot"></span>2부 · 세 사례의 공통점</div>
  <h2>세 수업이 공통으로 설계한 것</h2>
  <div class="grid g3">
    <div class="card bl-blue"><div class="big-num">1</div><h3>학생의 생각이 드러나게</h3><p>질문, 고쳐 쓴 문장, 감상처럼 학생만 만들 수 있는 것을 산출물로</p></div>
    <div class="card bl-green"><div class="big-num">2</div><h3>과정이 남게</h3><p>읽기 전후의 질문, 쓰기의 수정 기록이 평가와 피드백의 근거가 된다</p></div>
    <div class="card bl-purple"><div class="big-num">3</div><h3>목표에서 출발하게</h3><p>도구가 먼저가 아니라, 배워야 할 것에 맞춰 도구를 고르고 만든다</p></div>
  </div>`},

/* 15 3부 비판적 AI 리터러시 */
{sec:'3부 · 교사의 역량', html:`
  <div class="kicker"><span class="dot"></span>3부 · AI 시대 교사의 역량 ①</div>
  <h2>비판적 AI 리터러시 — 세 가지 질문</h2>
  <div class="grid g3">
    <div class="card bl-blue"><span class="tag t-blue">검증</span><h3>이 결과는 맞는가?</h3><p>리만 가설 증명도 검증 전까지는 '주장'이다. AI의 답에 근거를 묻고 확인하는 습관</p></div>
    <div class="card bl-red"><span class="tag t-red">책임</span><h3>정직하게 쓰고 있는가?</h3><p>세무사 시험 사례. 도구를 쓰는 능력과 정직하게 쓰는 태도는 다르다</p></div>
    <div class="card bl-green"><span class="tag t-green">배움</span><h3>나는 무엇을 배웠는가?</h3><p>AI가 대신한 부분과 내가 생각한 부분을 구분하고 설명할 수 있는가</p></div>
  </div>
  <div class="callout">교사가 먼저 이 질문을 습관으로 가질 때, 학생에게도 가르칠 수 있습니다.</div>
  ${src('unesco')}`},

/* 16 설계가 먼저 */
{sec:'3부 · 교사의 역량', html:`
  <div class="kicker"><span class="dot"></span>3부 · AI 시대 교사의 역량 ②</div>
  <h2>도구보다 수업 설계가 먼저인 이유</h2>
  <div class="flow">
    <div class="card bl-blue"><span class="tag t-blue">1</span><h3>목표</h3><p>학생이 무엇을 할 수 있게 되어야 하는가</p></div>
    <div class="arrow">→</div>
    <div class="card bl-green"><span class="tag t-green">2</span><h3>증거</h3><p>그것을 무엇으로 확인할 것인가 (AI가 대신할 수 없는 증거)</p></div>
    <div class="arrow">→</div>
    <div class="card bl-purple"><span class="tag t-purple">3</span><h3>활동</h3><p>그 증거가 나오려면 어떤 경험이 필요한가</p></div>
    <div class="arrow">→</div>
    <div class="card bl-orange"><span class="tag t-orange">4</span><h3>도구</h3><p>그 경험을 돕는 도구는 무엇인가 (없으면 만든다)</p></div>
  </div>

/* ---------- 저장소(체험 모드용) ---------- */
const mem = {};
const store = {
  get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
};
const DEMO = !CONFIG.SCRIPT_URL;
const BOARDS = ['opening','poll','etc','closing'];
const emptyBoards = ()=>({opening:[],poll:[],etc:[],closing:[]});

/* 체험 모드: 강의 회차(session)까지 브라우저에 흉내 냄 */
function demoDB(){
  let d; try{ d=JSON.parse(store.get('aic_demo2')||'null'); }catch(e){ d=null; }
  if(!d||!d.sessions){ d={sessions:[{id:'s1',label:'1회차',created:new Date().toISOString()}],rows:[]}; store.set('aic_demo2',JSON.stringify(d)); }
  return d;
}
function demoSave(d){ store.set('aic_demo2',JSON.stringify(d)); }
function groupRows(rows,sid){
  const b=emptyBoards();
  rows.filter(r=>r.s===sid).forEach(r=>{ if(b[r.b]) b[r.b].push({t:r.t,name:r.n,text:r.x}); });
  return b;
}

/* ---------- 실시간 보드 ---------- */
let DATA = emptyBoards();
let SESSION = {id:'', label:''};

async function api(params){
  const r = await fetch(CONFIG.SCRIPT_URL+'?'+new URLSearchParams(Object.assign({t:Date.now()},params)));
  return r.json();
}
async function apiPost(body){
  try{
    const r = await fetch(CONFIG.SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
    return await r.json();
  }catch(e){
    try{ await fetch(CONFIG.SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)}); return {ok:true}; }
    catch(e2){ return {ok:false,error:String(e2)}; }
  }
}

async function fetchAll(){
  if(DEMO){
    const d=demoDB(); const s=d.sessions[d.sessions.length-1];
    SESSION={id:s.id,label:s.label}; DATA=groupRows(d.rows,s.id); return;
  }
  try{
    const j = await api({action:'list'});
    if(j.ok){ DATA=Object.assign(emptyBoards(), j.boards); SESSION=j.session||SESSION; }
  }catch(e){ console.warn('fetch failed', e); }
}
async function postEntry(board,name,text){
  if(DEMO){
    const d=demoDB(); const s=d.sessions[d.sessions.length-1];
    d.rows.push({t:new Date().toISOString(),s:s.id,b:board,n:name,x:text}); demoSave(d); return true;
  }
  const j = await apiPost({action:'add',board,name,text});
  return !!j.ok;
}
async function resetSession(key,label){
  if(DEMO){
    const d=demoDB(); const id='s'+(d.sessions.length+1)+'_'+Date.now().toString(36);
    d.sessions.push({id,label:label||`${d.sessions.length+1}회차`,created:new Date().toISOString()}); demoSave(d); return {ok:true};
  }
  return apiPost({action:'reset',key,label});
}
async function fetchHistory(){
  if(DEMO){
    const d=demoDB();
    return {ok:true,current:d.sessions[d.sessions.length-1].id,
      sessions:d.sessions.map(s=>Object.assign({},s,{boards:groupRows(d.rows,s.id)}))};
  }
  return api({action:'history'});
}

const votedKey = ()=>'aic_voted_'+(SESSION.id||'x');

function buildBoards(){
  document.querySelectorAll('.board').forEach(b=>{
    const key=b.dataset.board;
    b.innerHTML = `
      <form class="board-form">
        <input name="name" maxlength="20" placeholder="이름(선택)">
        <textarea name="text" maxlength="300" placeholder="${esc(b.dataset.ph||'')}" required></textarea>
        <button type="submit">올리기</button>
      </form>
      <div class="board-meta"><span class="count">응답 0개</span><span>${DEMO?'<span class="mode-pill">체험 모드 · 이 기기에서만 보임</span>':'5초마다 자동 새로고침'}</span></div>
      <div class="notes"></div>`;
    const f=b.querySelector('form');
    const savedName = store.get('aic_name'); if(savedName) f.name.value=savedName;
    f.addEventListener('submit',async e=>{
      e.preventDefault();
      const text=f.text.value.trim(); if(!text) return;
      const name=f.name.value.trim().slice(0,20);
      store.set('aic_name',name);
      const btn=f.querySelector('button'); btn.disabled=true; btn.textContent='올리는 중…';
      DATA[key].push({t:new Date().toISOString(),name,text}); renderBoards();
      const ok = await postEntry(key,name,text);
      btn.disabled=false; btn.textContent= ok?'올리기':'다시 시도';
      if(ok){ f.text.value=''; }
      setTimeout(refresh,1200);
    });
    f.text.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();f.requestSubmit();} });
  });
  document.querySelectorAll('.poll').forEach(p=>{
    p.innerHTML = `<div class="poll-opts">${POLL_OPTIONS.map(o=>
      `<button class="popt" data-id="${o.id}"><i class="bar"></i><span>${esc(o.label)}</span><span class="cnt">0표</span></button>`).join('')}</div>
      <form class="etc-form" hidden>
        <input name="text" maxlength="100" placeholder="AI 시대에 학생이 꼭 배워야 할 것을 직접 써 주세요" required>
        <button type="submit">제출</button>
      </form>
      <div class="poll-note"><span class="total">0명 참여</span> <span class="sess"></span>${DEMO?' <span class="mode-pill">체험 모드</span>':''}</div>
      <div class="etc-notes"></div>`;
    const ef=p.querySelector('.etc-form');
    const vote=async(id,etcText)=>{
      if(store.get(votedKey())) return;
      store.set(votedKey(),id);
      DATA.poll.push({t:new Date().toISOString(),name:'',text:id});
      if(etcText) DATA.etc.push({t:new Date().toISOString(),name:'',text:etcText});
      renderBoards();
      await postEntry('poll','',id);
      if(etcText) await postEntry('etc','',etcText);
      setTimeout(refresh,1200);
    };
    p.querySelectorAll('.popt').forEach(btn=>btn.addEventListener('click',()=>{
      if(store.get(votedKey())) return;
      if(btn.dataset.id==='etc'){ ef.hidden=false; ef.text.focus(); return; }
      vote(btn.dataset.id);
    }));
    ef.addEventListener('submit',e=>{ e.preventDefault(); const t=ef.text.value.trim(); if(!t) return; ef.hidden=true; vote('etc',t.slice(0,100)); ef.text.value=''; });
  });
}

function pollCounts(list){
  const counts={}; POLL_OPTIONS.forEach(o=>counts[o.id]=0);
  (list||[]).forEach(x=>{ if(counts[x.text]!==undefined) counts[x.text]++; });
  return counts;
}

function renderBoards(){
  document.querySelectorAll('.board').forEach(b=>{
    const list=(DATA[b.dataset.board]||[]).slice().reverse();
    b.querySelector('.count').textContent=`응답 ${list.length}개`;
    const box=b.querySelector('.notes');
    const sig=SESSION.id+'|'+list.length+'|'+(list[0]?list[0].t:'');
    if(box.dataset.sig===sig) return; box.dataset.sig=sig;
    box.innerHTML = list.length? list.map(x=>`<div class="note">${esc(x.text)}<small>${esc(x.name||'익명')}</small></div>`).join('')
      : '<div class="empty">첫 응답을 기다리고 있어요</div>';
  });
  const counts=pollCounts(DATA.poll);
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  const max=Math.max(1,...Object.values(counts));
  const mine=store.get(votedKey());
  document.querySelectorAll('.poll').forEach(p=>{
    p.querySelectorAll('.popt').forEach(btn=>{
      const n=counts[btn.dataset.id];
      btn.querySelector('.cnt').textContent = total? `${n}표 · ${Math.round(n/total*100)}%` : '0표';
      btn.querySelector('.bar').style.width = (n/max*100)+'%';
      btn.classList.toggle('mine',mine===btn.dataset.id);
      btn.disabled=!!mine;
    });
    if(mine) p.querySelector('.etc-form').hidden=true;
    p.querySelector('.total').textContent = `${total}명 참여` + (mine?' · 투표 완료':'');
    p.querySelector('.sess').textContent = SESSION.label? `· ${SESSION.label}` : '';
    const etc=(DATA.etc||[]).slice().reverse();
    p.querySelector('.etc-notes').innerHTML = etc.length? `<div class="etc-title">기타 응답 ${etc.length}개</div><div class="notes">${etc.map(x=>`<div class="note">${esc(x.text)}</div>`).join('')}</div>` : '';
  });
}
async function refresh(){ await fetchAll(); renderBoards(); }

/* ---------- 리셋 / 이전 결과 ---------- */
function openModal(html){
  $('#modalBody').innerHTML=html; $('#modal').hidden=false;
}
$('#modalClose').onclick=()=>{$('#modal').hidden=true;};

function fmtDate(s){ try{ const d=new Date(s); return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`; }catch(e){ return ''; } }

async function showHistory(){
  openModal('<p class="small">불러오는 중…</p>');
  let j; try{ j=await fetchHistory(); }catch(e){ j={ok:false}; }
  if(!j||!j.ok){ openModal('<p>결과를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.</p>'); return; }
  const list=(j.sessions||[]).slice().reverse();
  openModal(`<h2 style="margin-bottom:6px">강의별 투표 결과</h2>
    <p class="small" style="margin-bottom:18px">"AI 시대, 학생이 꼭 배워야 할 한 가지는?" · 리셋해도 이전 결과는 그대로 남아 있습니다.</p>
    ${list.map(s=>{
      const b=s.boards||emptyBoards(); const c=pollCounts(b.poll);
      const tot=Object.values(c).reduce((a,x)=>a+x,0); const mx=Math.max(1,...Object.values(c));
      const rows=POLL_OPTIONS.map(o=>({o,n:c[o.id]})).sort((a,b)=>b.n-a.n);
      return `<details class="hist" ${s.id===j.current?'open':''}>
        <summary><b>${esc(s.label||'')}</b>${s.id===j.current?' <span class="mode-pill" style="background:var(--blue-soft);color:var(--blue)">진행 중</span>':''}
          <span class="small">${fmtDate(s.created)} · 투표 ${tot}명 · 여는 질문 ${(b.opening||[]).length} · 마무리 ${(b.closing||[]).length}</span></summary>
        <div class="hbars">${rows.map(r=>`<div class="hrow"><span>${esc(r.o.label)}</span><div class="hbar"><i style="width:${r.n/mx*100}%"></i></div><b>${r.n}${tot?` (${Math.round(r.n/tot*100)}%)`:''}</b></div>`).join('')}</div>
        ${(b.etc||[]).length?`<p class="small" style="margin:10px 0 4px">기타 응답</p><ul class="list">${b.etc.map(x=>`<li>${esc(x.text)}</li>`).join('')}</ul>`:''}
        ${(b.opening||[]).length?`<p class="small" style="margin:10px 0 4px">여는 질문 응답</p><ul class="list">${b.opening.map(x=>`<li>${esc(x.text)}</li>`).join('')}</ul>`:''}
        ${(b.closing||[]).length?`<p class="small" style="margin:10px 0 4px">마무리 응답</p><ul class="list">${b.closing.map(x=>`<li>${esc(x.text)}</li>`).join('')}</ul>`:''}
      </details>`;}).join('') || '<p>아직 기록이 없어요.</p>'}`);
}
async function doReset(){
  const label = window.prompt('새 강의 이름을 입력하세요 (예: 2026. 12. 3. 대학원 특강)\n이전 응답은 지워지지 않고 [이전 강의 결과 보기]에 보관됩니다.', '');
  if(label===null) return;
  let key='';
  if(!DEMO){ key = window.prompt('관리자 암호를 입력하세요 (Code.gs의 ADMIN_KEY)', ''); if(key===null) return; }

  if(j&&j.ok){ await refresh(); buildBoards(); renderBoards(); alert('새 강의를 시작했습니다. 여는 질문·투표·마무리 보드가 비워졌어요.'); }

}

  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea') return;
  if(document.body.classList.contains('doc')){ if(e.key==='d'||e.key==='D') setDoc(false); return; }
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1);}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1);}
  else if(e.key==='Home') go(0);
  else if(e.key==='End') go(slidesEl.length-1);
  else if(e.key==='f'||e.key==='F') $('#btnFull').click();
  else if(e.key==='d'||e.key==='D') setDoc(true);
});

/* ---------- 타이머 ---------- */
let tStart=null, tAcc=0, tInt=null;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function tick(){
  const sec=Math.floor((tAcc+(tStart?Date.now()-tStart:0))/1000);
  const el=$('#timer');
  el.textContent=`⏱ ${fmt(sec)} / ${fmt(CONFIG.TALK_MINUTES*60)}`;
  el.classList.toggle('over',sec>CONFIG.TALK_MINUTES*60);
}
$('#timer').addEventListener('click',()=>{
  if(tStart){tAcc+=Date.now()-tStart;tStart=null;clearInterval(tInt);$('#timer').classList.remove('run');}
  else{tStart=Date.now();tInt=setInterval(tick,500);$('#timer').classList.add('run');}
  tick();
});
$('#timer').addEventListener('dblclick',()=>{tStart=null;tAcc=0;clearInterval(tInt);$('#timer').classList.remove('run');tick();});

/* ---------- 시작 ---------- */
buildBoards();
refresh();
setInterval(()=>{ if(!document.hidden) refresh(); }, CONFIG.POLL_MS);
</script>
